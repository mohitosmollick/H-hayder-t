<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <section class="container m-8" x-data="countrySearch" x-init="fetchCountry()">
        <input x-model="search" type="search" id="default-search" class="block justify-center m-auto p-4  text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="Search Mockups, Logos..." />
                
        <div class=" p-4 text-center  sm:p-8 dark:bg-gray-800 dark:border-gray-700">
            <h5 class="my-4 text-3xl font-bold text-gray-900 dark:text-white">Work fast from anywhere</h5>
           
            <div class="items-center space-y-4  sm:space-y-0 sm:space-x-4 ">
                <template x-for="country in filterCountry" :key="country.name">
                    <div class="m-2 bg-gray-800 hover:bg-gray-700 focus:ring-4 focus:outline-none focus:ring-gray-300 text-white rounded-lg inline-flex items-center justify-center px-4 py-2.5 dark:bg-gray-700 dark:hover:bg-gray-600 dark:focus:ring-gray-700">
                    
                    <div class="text-left rtl:text-right">
                        <div class="mb-1 text-xs" x-text="country.name"></div>
                        <div class="-mt-1 font-sans text-sm font-semibold" x-text="country.capital"></div>
                        <div class="mb-1 text-xs" x-text="country.population"></div>
                    </div>
                </div>
                </template>
            </div>
        </div>
    </section>
    <script>
        const countrySearch = {
            search :'',
            countries:[],
            async fetchCountry() {
                const response = await fetch("https://restcountries.com/v3.1/all?fields=name,capital,population")
                const data = await response.json()
                this.countries = data.map(country=>({
                    name: country.name.common,
                    capital:country.capital ? country.capital[0] : "N/A",
                    population: country.population
                }))
            
            },
            filterCountry(){
            //    return this.countries
                return this.countries.filter(e=>
                    e.name.toLowerCase().startsWith(this.search.toLowerCase())
                )
            }
        }
    </script>
    
</body>
</html>
